name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyyaml jsonschema

      - name: Verify state machine source is tracked
        run: |
          test -f src/supervisor_cao/state/machine.py
          test -f src/supervisor_cao/state/__init__.py

      - name: Run unit tests
        run: python -m pytest tests/unit/ -q --no-header

      - name: Run integration tests
        run: python -m pytest tests/integration/ -q --no-header

      - name: Run simulated E2E (temp repo)
        run: PYTHONPATH=src python tests/e2e/test_temp_repo_e2e.py

      - name: Run secret scan
        run: python scripts/scan-secrets .

      - name: Verify doctor command imports
        run: PYTHONPATH=src python -m supervisor_cao.cli.main --help
