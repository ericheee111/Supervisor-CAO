# demo-project: a fully fictional example project configuration (PUBLIC).
#
# This is a reference template showing every field the platform understands.
# All values here are placeholders — real hosts, container names, usernames,
# and paths go in the private ~/.config/supervisor-cao/projects/<project>.local.yaml
# (never committed). Nothing here refers to a real repository or environment.
name: demo-project
base_branch: main
task_branch_prefix: agent/

# Main clone path for the agent. Real value is private (set in local config).
# This placeholder is intentionally generic.
wsl_repo: "<PROJECT_REPO_PATH>"
# Optional secondary repository path (private). Used by the platform sync step.
windows_repo: "<WINDOWS_REPO_PATH>"

# Project-default verification rules. Local and remote verification are driven
# by configured commands/plugins; the core only reads exit codes, logs, SHAs,
# and structured results.
default_verification:
  local:
    build: true
    focused_tests: true
    candidate_sha_check: true
  remote:
    install: true
    correctness_tests: true
    log_collection: true
  report:
    structured: true

# Remote validation environment (private details in local config). Sanitized.
# The platform treats this opaquely: it acquires a lock, records/restores git
# state, runs the configured verification command, and reads the exit code.
remote_validation:
  ssh_host: "<SSH_HOST>"
  containers: ["<CONTAINER_A>", "<CONTAINER_B>"]
  user: "<REMOTE_USER>"
  repo_path: "<REMOTE_REPOSITORY_PATH>"
  env: "<REMOTE_ENV>"

# Executor loop limits.
executor_limits:
  max_rounds: 8
  max_no_progress_rounds: 2
  push_every_valid_candidate: true
  require_clean_worktree: true
  require_commit: true
  # Maximum wall-clock seconds a single worker may run. null = no total limit;
  # the worker is allowed to run indefinitely as long as it shows progress
  # (output growth, PROCESSING status, or alive subprocess). Only when ALL
  # progress indicators stop for stall_timeout seconds is the handle marked
  # STALLED. Set an integer to enforce a hard cap (rarely needed).
  max_runtime: null
  # Per-stage stall-timeout overrides. If a stage key is present, its value
  # overrides the project-level stall_timeout for that stage only.
  stall_overrides:
    planner: 600        # Codex planner should not stall longer than 10 min
    implementation: 1800  # executor may need up to 30 min
    review: 900
    incremental_review: 600

# Stall detection: when ALL progress indicators (CAO status PROCESSING,
# subprocess alive, output growth, CPU/IO change) are stopped for this many
# seconds, the worker handle is marked STALLED. Default 1800s (30 min).
# The handle's resume_state is saved; a reattach is attempted before
# transitioning the task to NEEDS_HUMAN.
stall_timeout: 1800

# Generated-artifact patterns: paths the executor may create but MUST NOT
# commit. The platform is language-agnostic; the generic default is EMPTY.
# A project using Python sets these in its LOCAL config (not here) e.g.:
#   generated_artifact_patterns:
#     - "__pycache__"
#     - "*.pyc"
#     - "*.egg-info"
#     - ".eggs"
#     - "build"
#     - "dist"
#     - ".pytest_cache"
# The executor cleanup removes only UNTRACKED files matching these patterns
# inside the worktree. A candidate commit containing any matching path is
# REJECTED (the executor must re-submit without the artifacts).
generated_artifact_patterns: []

# Codex budget per task. Enforced in code, not by the Supervisor.
codex_budget:
  max_calls_per_task: 4
  planner: 1
  full_review: 1
  incremental_review: 1
  judge: 1

# Task-level overrides MUST supply (no guessing allowed):
#   baseline_sha: <SHA>
#   required_test_scope: <list>
#   performance_acceptance: <threshold>   # optional, project-dependent
#   regression_threshold: <max regression> # optional, project-dependent
# Missing critical params -> NEEDS_HUMAN.
